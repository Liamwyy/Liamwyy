name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-3d-settings.json

      - name: Keep only the 3D graph
        run: |
          python3 - profile-3d-contrib/profile-night-clear.svg <<'EOF'
          import re, sys, xml.etree.ElementTree as ET
          ET.register_namespace('', 'http://www.w3.org/2000/svg')
          ET.register_namespace('xlink', 'http://www.w3.org/1999/xlink')
          path = sys.argv[1]
          tree = ET.parse(path)
          root = tree.getroot()
          graph = next(c for c in root if c.tag.endswith('}g'))
          for c in list(root):
              if c is not graph and not c.tag.endswith('}style'):
                  root.remove(c)
          ys = [float(y) for y in re.findall(r'translate\([\d.\-]+[ ,]+([\d.\-]+)\)', ET.tostring(graph, encoding='unicode'))]
          top = max(0, int(min(ys)) - 10)
          h = 850 - top
          root.set('viewBox', f'0 {top} 1240 {h}')
          root.set('width', '1240')
          root.set('height', str(h))
          tree.write(path,
          EOF

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
